name: PostgreSQL integration

on:
  push:
    branches:
      - issue-23-postgres-ci
  pull_request:

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dungeon_critters_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d dungeon_critters_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/dungeon_critters_test
      RACK_ENV: test
      VERIFICATION_TOKEN_SECRETS: '{"v1":"ci-only-test-secret"}'
      VERIFICATION_TOKEN_KEY_VERSION: v1
      RESEND_API_KEY: ci-only
      RESEND_FROM_EMAIL: noreply@example.test
      PUBLIC_API_URL: http://localhost:9292
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - run: bundle exec ruby test/server_postgres_integration_test.rb
